name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.2，不带 v）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: '28.2.13676358'
      CMAKE_VERSION: '3.22.1'
      FLUTTER_VERSION: '3.47.7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize local build paths
        shell: bash
        run: |
          set -euo pipefail
          # 本机为离线构建把 gradle 发行包指向了本地 file:// 路径，CI 必须换回官方地址
          python3 - <<'PY'
          import re
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          s = open(p).read()
          m = re.search(r'gradle-(\d[\d.]*)-bin', s)
          ver = m.group(1) if m else '8.14.5'
          s = re.sub(
              r'(?m)^distributionUrl=.*$',
              r'distributionUrl=https\\://services.gradle.org/distributions/gradle-%s-bin.zip' % ver,
              s,
          )
          open(p, 'w').write(s)
          print(open(p).read())
          PY
          chmod +x android/gradlew
          # 确认没有残留的本机绝对路径
          if git grep -n -E 'D:[\\/]Bealib' -- . ':!*.dart_tool'; then
            echo "仓库中仍存在本机绝对路径" >&2
            exit 1
          fi

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "无法解析版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Configure local.properties
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "flutter.sdk=${FLUTTER_ROOT}"
          } > android/local.properties
          cat android/local.properties

      # release 构建目前沿用 debug 签名（内部自用）。签名必须与历史安装包一致，
      # 否则老用户无法覆盖升级。优先使用 GitHub Secret 中的 keystore（仓库公开时
      # 更安全），没有配置时回退到仓库里的 ci/debug.keystore。
      - name: Restore stable signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "使用 GitHub Secret 中的 keystore"
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$HOME/.android/debug.keystore"
          elif [ -f ci/debug.keystore ]; then
            echo "使用仓库内置 ci/debug.keystore"
            cp ci/debug.keystore "$HOME/.android/debug.keystore"
          else
            echo "缺少签名 keystore（配置 ANDROID_DEBUG_KEYSTORE_BASE64 或提交 ci/debug.keystore）" >&2
            exit 1
          fi
          test -s "$HOME/.android/debug.keystore" || {
            echo "keystore 恢复失败" >&2
            exit 1
          }
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android >/dev/null
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -m1 'SHA256:' || true
          echo "keystore OK"
          # 显式告诉 Gradle 用哪个 keystore（不再依赖 ~/.android 默认路径）
          {
            echo "BEALIB_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo "BEALIB_KEYSTORE_STORE_PASSWORD=android"
            echo "BEALIB_KEYSTORE_ALIAS=androiddebugkey"
            echo "BEALIB_KEYSTORE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"


      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build_number }}

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "APK 不存在: $APK" >&2; exit 1; }
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest'

      - name: Collect artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="Bealib-${{ steps.ver.outputs.version }}-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" | tee checksum.txt
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Bealib ${{ steps.ver.outputs.tag }}
          body: |
            优化了软件
          files: |
            ${{ steps.artifact.outputs.apk }}
            checksum.txt
