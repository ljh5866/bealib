name: bealib
description: "Bealib —— 基于自定义规则的番剧采集与在线观看客户端（Kazumi 二次开发）。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  ech_http: ^0.2.2
  http: ^1.6.0
  image: ^4.8.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.1
  audio_video_progress_bar: ^2.0.2
  audio_service: ^0.18.15
  audio_service_mpris:
    path: vendor/audio-service-mpris
  audio_service_win:
    path: vendor/audio_service_win
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  flutter_displaymode: ^0.6.0

  url_launcher: ^6.3.0
  window_manager: ^0.5.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

  canvas_danmaku: ^0.3.3
  webdav_client: ^1.2.2
  tray_manager: ^0.5.0
  dlna_dart: ^0.0.8
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_ohos: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1
  flutter_foreground_task: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_ios: ^1.1.2
  flutter_inappwebview_macos: ^1.1.2
  flutter_inappwebview_android: ^1.1.3
  upgrader: ^12.3.0
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  photo_view: ^0.15.0
  win32: ^5.15.0
  ffi: ^2.1.0
  image_picker: ^1.2.1
  webview_windows:
    path: vendor/flutter-webview-windows
  desktop_webview_window:
    path: vendor/linux_webview_window
  media_kit:
    path: vendor/media-kit/media_kit
  media_kit_video:
    path: vendor/media-kit/media_kit_video
  macos_secure_bookmarks: ^0.2.1

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.12

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo/logo_android.png
  image_path_android: assets/images/logo/logo_android.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_foreground.png
  adaptive_icon_monochrome: assets/images/logo/logo_monochrome.png
  macos:
    generate: false
  windows:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
    icon_size: 256

msix_config:
  display_name: Bealib
  publisher: CN=Bealib, O=Bealib, C=CN
  logo_path: assets/images/logo/logo_rounded.png
  sign_msix: false
  install_certificate: false
  build_windows: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
    - assets/images/logo/
    - assets/statements/
    - licenses/ech_http/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
